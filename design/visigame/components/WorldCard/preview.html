<!-- @dsCard group="Selection" height=360 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Preview</title></head>
<body>
<div id="root"></div>
<script>
  var V = window.Visigame, h = React.createElement;
  function art(tone, focus) {
    var s = function (v) { return { fill: 'var(--' + v + ')' }; };
    return h('svg', { viewBox: '0 0 320 200', preserveAspectRatio: 'xMidYMid slice', 'aria-hidden': true },
      h('rect', { width: 320, height: 200, style: s('surface-000') }),
      h('circle', { cx: 40, cy: 44, r: 22, style: Object.assign(s(tone), { opacity: .22 }) }),
      h('circle', { cx: 272, cy: 36, r: 30, style: Object.assign(s('ink'), { opacity: .08 }) }),
      h('circle', { cx: 250, cy: 150, r: 14, style: Object.assign(s(tone), { opacity: .18 }) }),
      h('path', { d: 'M92 150 L228 150 L212 176 L108 176 Z', style: s('surface-300') }),
      h('path', { d: 'M100 150 L160 118 L220 150 L160 166 Z', style: s(focus) }),
      h('rect', { x: 136, y: 104, width: 18, height: 30, rx: 2, style: s(tone) }),
      h('rect', { x: 162, y: 96, width: 14, height: 38, rx: 2, style: s('ink') }),
      h('circle', { cx: 190, cy: 118, r: 11, style: s(tone) }));
  }

  function Demo() {
    var st = React.useState('meadow'); var sel = st[0], set = st[1];
    return h('div', { className: 'vg-grid', style: { display: 'flex', gap: 'var(--space-5)', padding: 'var(--space-5)', flexWrap: 'wrap' } },
      h(V.WorldCard, { title: 'Meadow Village', meta: ['Shooter', 'Temperate', '~6 min'], art: art('tungsten', 'success'), selected: sel === 'meadow', onSelect: function () { set('meadow'); }, status: h(V.Tally, { state: 'ready' }, 'Playable') }),
      h(V.WorldCard, { title: 'Desert Oasis', meta: ['Exploration', 'Arid'], art: art('zebra', 'tungsten'), selected: sel === 'oasis', onSelect: function () { set('oasis'); } }),
      h(V.WorldCard, { title: 'Snow Village', meta: ['Shooter', 'Alpine'], art: art('peaking', 'ink'), selected: sel === 'snow', onSelect: function () { set('snow'); } }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));

</script>
</body>
</html>
