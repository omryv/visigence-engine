<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Preview</title></head>
<body>
<div id="root"></div>
<script>
  var V = window.Visigame, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'vg-stage', style: { gap: 'var(--space-6)' } },
    h(V.Tally, { state: 'live' }), h(V.Tally, { state: 'ready' }, 'Compiled'), h(V.Tally, { state: 'warn' }, 'Unsaved'), h(V.Tally, { state: 'idle' }, 'Offline')));

</script>
</body>
</html>
