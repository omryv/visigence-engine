<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<title>VISIGENCE — make me a place</title>
<meta name="description" content="Type a place and it is made: terrain, roads, houses, furnished rooms, people — generated in seconds, walkable on foot, downloadable as a Unity scene and a site plan. Same words, same place.">

<!-- The same lock every other page on this origin carries: a string cannot
     become markup. This page puts the visitor's own typed brief on screen,
     which is exactly the kind of text the lock exists for — it travels
     through textContent only, and the policy makes that a rule rather than
     a habit. -->
<meta http-equiv="Content-Security-Policy"
      content="require-trusted-types-for 'script'; trusted-types worldfoundry">

<link rel="icon" href="./favicon.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./editor/world/css/make.css">
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/build/three.webgpu.min.js",
    "three/webgpu": "/vendor/three/build/three.webgpu.min.js",
    "three/tsl": "/vendor/three/build/three.tsl.min.js",
    "three/addons/": "/vendor/three/examples/jsm/"
  }
}
</script>
</head>

<!-- ══ THE MACHINE ══
     One page, one promise, three verbs. The editor is a workbench and the
     library is a gallery; this is the VENDING MACHINE — the whole product
     compressed to the sentence a visitor understands in three seconds:

       type a place  →  get the place  →  walk in / another one / take it

     Nothing here is new machinery. The build is js/worlds.js's buildWorld,
     the same one press the editor's palette fires — terrain, landform,
     roads, houses, furnished and validated rooms, planting, light — and the
     film is js/cinematic.js's arrival. What is new is the SHELL: this page
     refuses to grow a second control. Every "could we also…" belongs in the
     editor (linked below, hairline), which exists to absorb complexity so
     this page never has to.

     The brief is a SEED, not a prompt. js/make-brief.js reads the words for
     the world they name — island words make the island, coastal words the
     coast — and the whole text seeds the generator, so the same words are
     the same place, on purpose, forever. That determinism is the honest
     version of "it understood me", and it is what makes a made place
     shareable: tell somebody your words and they stand where you stood. -->
<body class="asking">

<canvas id="viewport"></canvas>
<div id="dim" aria-hidden="true"></div>

<section id="ask" aria-label="Make a place">
  <a class="mk-brand" href="/"><b>VISIGENESIS</b><i>BY VISIGENCE</i></a>
  <h1>Make me a place.</h1>
  <div id="ask-row">
    <label class="sr" for="brief">Describe a place</label>
    <input id="brief" type="text" maxlength="80" autocomplete="off" spellcheck="false"
           enterkeyhint="go" placeholder="a fishing village on a cold coast">
    <button id="make" type="button">Make</button>
  </div>
  <p id="ask-hint">terrain · roads · houses · furnished rooms · people — in seconds,
    and the same words are the same place</p>
  <p id="ask-alt"><a href="/">see the worlds live</a> ·
    <a href="/editor">open the full editor</a></p>
</section>

<p id="status" aria-live="polite" hidden></p>

<nav id="verbs" aria-label="What now" hidden>
  <button id="v-brief" type="button" title="Different words">
    <span id="v-brief-text"></span>
    <!-- What the words were read as, and what they asked for that this engine
         cannot build yet. The brief moves the grammar, the hour, the weather,
         the air, the size of the settlement and the age of its buildings, and
         a page that applies all that silently leaves a person guessing which
         of their words did anything. -->
    <span id="v-brief-read"></span>
  </button>
  <div id="verb-keys">
    <button id="v-walk" type="button">Walk in</button>
    <button id="v-again" type="button">Another one</button>
    <button id="v-take" type="button" title="Download the Unity bundle, the site plan and the world file">Take it</button>
  </div>
  <a id="v-edit" href="/editor">open the editor →</a>
</nav>

<p id="hint" hidden>WASD to walk · E to use what is in a room · Esc to come back</p>

<script type="module" src="./editor/world/make.js"></script>
</body>
</html>
