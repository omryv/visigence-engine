<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission result presentation fixture</title><link rel="stylesheet" href="/editor/studio.css"><link rel="stylesheet" href="/editor/player.css"></head><body data-mode="play"><div id="player-front"></div><button id="remix-return" hidden>Back</button><button id="front-export" hidden>Export</button><button id="close-preview" hidden>Close</button><section id="fixture-result" class="play-overlay" style="position:fixed;inset:0;z-index:20;background-color:#0b0d10" hidden><span>MISSION COMPLETE</span><h2>Mission accomplished.</h2><p>Presentation fixture · simulated 1:23.4 run</p><div id="mission-result"></div><button class="primary" id="fixture-replay">Play again</button><div id="result-actions"><button id="result-share">Beat this</button><button id="result-image">Save card</button><button id="result-home">Choose a world</button></div></section><button id="fixture-show" style="position:fixed;bottom:10px;left:10px;z-index:30;background:#c4e5b3;color:#132017;padding:14px">Show test result</button><div id="toast" role="status" class="toast" hidden></div><script type="module">
import { mountPlayerFront } from '/editor/playerFront.js';
import { quickMission } from '/src/world/missionCard.js';
let project=quickMission('arcade','TEST-RESU-LT22');
const front=mountPlayerFront({getProject:()=>project,change:p=>project={...project,...p},play:()=>{},remix:()=>{},download:()=>{},toast:text=>{const t=document.querySelector('#toast');t.textContent=text;t.hidden=false;}});
document.querySelector('#fixture-show').onclick=()=>{front.result(project,{state:'VICTORY',time:83.4});document.querySelector('#fixture-result').hidden=false;};
document.querySelector('#close-preview').onclick=()=>document.querySelector('#fixture-result').hidden=true;
document.querySelector('#fixture-replay').onclick=()=>document.querySelector('#fixture-result').hidden=true;
</script></body></html>
