<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator workflow QA fixture</title><link rel="stylesheet" href="/editor/studio.css"><link rel="stylesheet" href="/editor/player.css"><script type="importmap">{"imports":{"three":"/vendor/three/build/three.webgpu.min.js","three/webgpu":"/vendor/three/build/three.webgpu.min.js","three/tsl":"/vendor/three/build/three.tsl.min.js","three/addons/":"/vendor/three/examples/jsm/"}}</script></head><body data-mode="play"><div id="player-front"></div><button id="remix-return" hidden>Back</button><button id="front-export" hidden>Export</button><button id="close-preview" hidden>Close</button><div id="mission-result" hidden></div><div id="result-actions" hidden><button id="result-home">Home</button><button id="result-share">Share</button><button id="result-image">Save</button></div><aside style="padding:20px;background:#1b2632;color:#fff">Creator QA fixture — generation is checked separately.<button id="qa-identity" style="padding:12px;border:1px solid #999">Test identity image upload</button><pre id="qa-state" style="white-space:pre-wrap"></pre></aside><div id="toast" class="toast" role="status" hidden></div><script type="module">
import {mountPlayerFront} from '/editor/playerFront.js';import {quickMission} from '/src/world/missionCard.js';import {resolveProject} from '/src/world/shooterProject.js';import {openIdentity} from '/editor/creatorTools.js';
let project=quickMission('arcade'),front;const toast=text=>{const el=document.querySelector('#toast');el.textContent=text;el.hidden=false;};const change=patch=>{project=resolveProject({...project,...patch});document.querySelector('#qa-state').textContent=JSON.stringify({props:project.importedProps,presentation:project.presentation},null,2);};

 button.onclick=async()=>{const r=await fetch('/assets/v2/arcade/arcade-lookdev-review.png'),file=new File([await r.blob()],'mission-qa.png',{type:'image/png'}),data=new DataTransfer();data.items.add(file);dialog.elements.artwork.files=data.files;dialog.elements.artwork.dispatchEvent(new Event('change',{bubbles:true}));};
};
